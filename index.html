<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Starry Background</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background:
            radial-gradient(circle at 50% 40%, #18245a 0%, #090d2b 45%, #02030d 100%);
        position: relative;
    }

    /* Bầu trời */
    .sky {
        position: absolute;
        inset: 0;
        overflow: hidden;
    }

    /* Ngôi sao */
    .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        box-shadow:
            0 0 5px white,
            0 0 10px rgba(255,255,255,.8);
        animation:
            twinkle var(--duration) ease-in-out infinite,
            float var(--float) ease-in-out infinite;
    }

    /* Sao lớn */
    .star.big {
        width: 5px;
        height: 5px;
        box-shadow:
            0 0 6px white,
            0 0 14px white,
            0 0 25px rgba(150,190,255,.8);
    }

    /* Hiệu ứng lấp lánh hình chữ thập */
    .star.sparkle::before,
    .star.sparkle::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: white;
        border-radius: 50%;
    }

    .star.sparkle::before {
        width: 1px;
        height: 24px;
        box-shadow: 0 0 5px white;
    }

    .star.sparkle::after {
        width: 24px;
        height: 1px;
        box-shadow: 0 0 5px white;
    }

    /* Tạo ánh sáng mờ phía sau */
    .glow {
        position: absolute;
        width: 350px;
        height: 350px;
        border-radius: 50%;
        background: rgba(70, 100, 255, .08);
        filter: blur(70px);
        animation: glowMove 10s ease-in-out infinite alternate;
    }

    .glow:nth-child(1) {
        top: -100px;
        left: -100px;
    }

    .glow:nth-child(2) {
        right: -100px;
        bottom: -100px;
        animation-delay: -4s;
    }

    /* Sao băng */
    .shooting-star {
        position: absolute;
        width: 120px;
        height: 2px;
        background: linear-gradient(
            90deg,
            rgba(255,255,255,0),
            white
        );
        transform: rotate(-35deg);
        filter: drop-shadow(0 0 6px white);
        opacity: 0;
        animation: shooting 7s linear infinite;
    }

    .shooting-star:nth-child(3) {
        top: 20%;
        left: 75%;
        animation-delay: 2s;
    }

    .shooting-star:nth-child(4) {
        top: 45%;
        left: 90%;
        animation-delay: 5s;
        animation-duration: 8s;
    }

    /* Hiệu ứng sao nhấp nháy */
    @keyframes twinkle {
        0%, 100% {
            opacity: .25;
            transform: scale(.7);
        }

        50% {
            opacity: 1;
            transform: scale(1.5);
        }
    }

    @keyframes float {
        0%, 100% {
            margin-top: 0;
        }

        50% {
            margin-top: -5px;
        }
    }

    /* Ánh sáng nền chuyển động */
    @keyframes glowMove {
        0% {
            transform: translate(0, 0) scale(1);
        }

        100% {
            transform: translate(100px, 50px) scale(1.3);
        }
    }

    /* Sao băng */
    @keyframes shooting {
        0% {
            opacity: 0;
            transform: translate(0, 0) rotate(-35deg);
        }

        5% {
            opacity: 1;
        }

        20% {
            opacity: 0;
            transform: translate(-500px, 350px) rotate(-35deg);
        }

        100% {
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="sky">

    <!-- Ánh sáng nền -->
    <div class="glow"></div>
    <div class="glow"></div>

    <!-- Sao băng -->
    <div class="shooting-star"></div>
    <div class="shooting-star"></div>

</div>

<script>
    const sky = document.querySelector(".sky");

    // Số lượng sao
    const STAR_COUNT = 180;

    for (let i = 0; i < STAR_COUNT; i++) {

        const star = document.createElement("div");
        star.classList.add("star");

        // Một số sao lớn hơn
        if (Math.random() < 0.12) {
            star.classList.add("big");
        }

        // Một số sao có hiệu ứng lấp lánh
        if (Math.random() < 0.08) {
            star.classList.add("sparkle");
        }

        // Vị trí ngẫu nhiên
        star.style.left = Math.random() * 100 + "%";
        star.style.top = Math.random() * 100 + "%";

        // Thời gian nhấp nháy ngẫu nhiên
        star.style.setProperty(
            "--duration",
            (2 + Math.random() * 5) + "s"
        );

        // Thời gian trôi nhẹ
        star.style.setProperty(
            "--float",
            (3 + Math.random() * 5) + "s"
        );

        // Delay ngẫu nhiên để sao không nhấp nháy cùng lúc
        star.style.animationDelay =
            (-Math.random() * 6) + "s";

        sky.appendChild(star);
    }
</script>

</body>
</html>

	
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuộn hình ảnh</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0b1026;
        min-height: 100vh;
        display: flex;
        align-items: end;
        justify-content: end;
        overflow: hidden;
    }

    /* Khung cuộn */
    .slider {
        width: 100%;
        overflow: hidden;
        position: relative;
        padding: 20px 0;
    }

    /* Dải hình ảnh */
    .slider-track {
        display: flex;
        width: max-content;
        gap: 20px;
        animation: scroll 25s linear infinite;
    }

    /* Hình ảnh */
    .slider img {
        width: 220px;
        height: 150px;
        object-fit: cover;
        border-radius: 18px;

        box-shadow:
            0 0 10px rgba(255,255,255,.2),
            0 0 25px rgba(100,150,255,.2);

        transition: .4s;
    }

    /* Hover vào ảnh */
    .slider img:hover {
        transform: scale(1.08);
        box-shadow:
            0 0 15px white,
            0 0 35px rgba(100,150,255,.8);
    }

    /* Hiệu ứng cuộn */
    @keyframes scroll {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-50%);
        }
    }

    /* Làm mờ hai bên */
    .slider::before,
    .slider::after {
        content: "";
        position: absolute;
        top: 0;
        width: 100px;
        height: 100%;
        z-index: 2;
        pointer-events: none;
    }

    .slider::before {
        left: 0;
        background: linear-gradient(
            to right,
            #0b1026,
            transparent
        );
    }

    .slider::after {
        right: 0;
        background: linear-gradient(
            to left,
            #0b1026,
            transparent
        );
    }

    /* Điện thoại */
    @media (max-width: 600px) {

        .slider img {
            width: 160px;
            height: 110px;
        }

        .slider-track {
            gap: 12px;
            animation-duration: 18s;
        }
    }
</style>
</head>

<body>
